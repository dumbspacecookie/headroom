# The same 12-lens gate that runs locally, on a clean machine, on both operating systems.
# Results are byte-compared against committed artifacts, so a platform that computes different
# floats fails here rather than on someone's laptop.
name: gate

on:
  push:
  pull_request:

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: .python-version
      - run: python -m pip install -r requirements.txt
      - run: python run.py gate
        env:
          PYTHONIOENCODING: utf-8
